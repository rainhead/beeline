# Apache vhost for the Beeline sandbox on maderas (TEMPORARY hosting —
# revisit at cutover, December 2026). certbot --apache clones this into
# beeline.beeatlas.net-le-ssl.conf and adds the HTTPS redirect, the same
# shape as beeatlas.net.
<VirtualHost *:80>
    ServerName beeline.beeatlas.net

    # Sessions ride on cookies: once TLS exists, port 80 must only redirect.
    # Guarded on the cert file so this stays true even when the runbook
    # re-copies this file over certbot's edits; before certbot runs, the
    # plain proxy below lets the site bootstrap.
    <IfFile /etc/letsencrypt/live/beeline.beeatlas.net/fullchain.pem>
        Redirect permanent / https://beeline.beeatlas.net/
    </IfFile>
    <IfFile !/etc/letsencrypt/live/beeline.beeatlas.net/fullchain.pem>
        ProxyPreserveHost On
        ProxyPass        / http://127.0.0.1:3054/
        ProxyPassReverse / http://127.0.0.1:3054/
    </IfFile>

    ErrorLog ${APACHE_LOG_DIR}/beeline_error.log
    CustomLog ${APACHE_LOG_DIR}/beeline_access.log combined
</VirtualHost>
