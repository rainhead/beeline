# Apache vhost for beeline.beeatlas.net AFTER the app moved to Fly.
#
# The app is gone from this host — the systemd unit is stopped and disabled —
# but the hostname is not, and volunteers and staff have it in bookmarks and
# in mail. So this redirects rather than 404s or dies: an old link lands on
# the new address instead of on a proxy error, which is what would otherwise
# happen, port 3054 having nothing behind it.
#
# Permanent (301), because it is. Nothing here will serve Beeline again.
#
# NOT a DNS change. The record still points at maderas, which is deliberate
# for now: the OAuth app's single redirect URI reads beeline.fly.dev, so
# moving the hostname would break sign-in until the registration moved with
# it. That is the cutover, and it is a decision rather than a tidy-up.
#
# Apply (needs sudo, so a human):
#   sudo cp infra/maderas/beeline.beeatlas.net-retired.conf \
#           /etc/apache2/sites-available/beeline.beeatlas.net.conf
#   sudo a2dissite beeline.beeatlas.net-le-ssl   # certbot's TLS clone
#   sudo cp infra/maderas/beeline.beeatlas.net-retired.conf \
#           /etc/apache2/sites-available/beeline.beeatlas.net-le-ssl.conf
#   # then re-add certbot's SSLCertificateFile lines to the -le-ssl copy, or
#   # simply run: sudo certbot --apache -d beeline.beeatlas.net
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Keep the certificate renewing while this redirect stands: a browser that
# meets an expired certificate shows a warning rather than following the
# redirect, which is worse than the proxy error this replaces.

<VirtualHost *:80>
    ServerName beeline.beeatlas.net
    Redirect permanent / https://beeline.fly.dev/
    ErrorLog ${APACHE_LOG_DIR}/beeline_error.log
    CustomLog ${APACHE_LOG_DIR}/beeline_access.log combined
</VirtualHost>
